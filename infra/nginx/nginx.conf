worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  error_log /dev/stderr warn;

  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path /tmp/nginx-proxy;

  # Preserve metadata supplied by Dokploy's edge proxy, falling back to this
  # nginx hop when it is run directly during local development.
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
  }

  map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    "" $http_host;
  }

  map $http_x_real_ip $forwarded_real_ip {
    default $http_x_real_ip;
    "" $remote_addr;
  }

  upstream web_app {
    server veles-web:3000;
  }

  server {
    listen 80;

    # Keep slightly above RECIPE_UPLOAD_MAX_REQUEST_BYTES so the application can
    # return its own validation error while nginx rejects unexpectedly large bodies.
    client_max_body_size 100m;

    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
    }

    location / {
      proxy_pass http://web_app;
      proxy_http_version 1.1;

      # Buffering is intentional: nginx validates the full request size and spills
      # larger allowed uploads to its temporary filesystem before forwarding them,
      # keeping oversized request bodies out of the Node process.
      proxy_request_buffering on;

      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $forwarded_host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $forwarded_real_ip;
    }
  }
}
